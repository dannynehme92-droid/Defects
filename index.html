<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defect inspection</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F7A80">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#E4EAEC; --surface:#F8FAFA; --raised:#FFFFFF; --ink:#1B2A34; --muted:#52636D; --line:#C6D0D5;
  --primary:#1F5FA6; --primary-ink:#FFFFFF; --hazard:#B3212F;
  --teal:#2F7A80; --teal-ink:#FFFFFF; --teal-bg:#DCEEEF;
  --amber:#E9A93B; --amber-ink:#1B2A34; --amber-bg:#FBEBCB;
  --red:#C93A33; --red-ink:#FFFFFF; --red-bg:#F8DAD7;
  --cam:#2A2326;
  --ok:#277A4B; --ok-ink:#FFFFFF; --ok-bg:#DDEFE5; --off:#66747C;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0F161A; --surface:#182229; --raised:#1F2B33; --ink:#E7EDF0; --muted:#9DACB5; --line:#33444E;
    --primary:#6FAEEA; --primary-ink:#0D1A26; --hazard:#FF8C97;
    --teal:#4FA6AD; --teal-ink:#08181A; --teal-bg:#173A3D;
    --amber:#E9A93B; --amber-ink:#1B2A34; --amber-bg:#443211;
    --red:#E5645D; --red-ink:#230806; --red-bg:#4A1D1A;
    --cam:#3A3236;
    --ok:#6CCB9B; --ok-ink:#0C2417; --ok-bg:#173A2B; --off:#4A5A64;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,p{margin:0}
h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;letter-spacing:-.005em}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--surface);padding-bottom:24px}
.sub{color:var(--muted);font-size:15px}
.pad{padding:16px}

.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;min-height:52px}
.brand{font-weight:750;padding:0 8px}
.back{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--primary);padding:10px 10px 10px 4px;font-weight:600;min-height:44px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:650}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.danger{background:transparent;border-color:var(--hazard);color:var(--hazard)}
.btn.block{width:100%}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--raised)}
textarea{resize:vertical;line-height:1.4}

/* cards */
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px;margin-bottom:14px}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:0 2px}
.chead h2{flex:1}
.tile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.card.b .tile{background:var(--teal-bg);color:var(--teal)}
.card.u .tile{background:var(--amber-bg);color:#8A5A00}
.card.i .tile{background:var(--red-bg);color:var(--red)}
@media (prefers-color-scheme: dark){ .card.u .tile{color:var(--amber)} }
.addbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:0;font-weight:650;font-size:15px}
.card.b .addbtn{background:var(--teal);color:var(--teal-ink)}
.card.u .addbtn{background:var(--amber);color:var(--amber-ink)}
.card.i .addbtn{background:var(--red);color:var(--red-ink)}
.thead{display:grid;gap:8px;padding:6px 44px 6px 10px;color:var(--muted);font-size:14px}
.trow{display:flex;align-items:stretch;border-radius:8px}
.rmain{flex:1;min-width:0;display:grid;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:12px 10px;min-height:52px;color:inherit;border-radius:8px}
.dots{width:44px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;border-radius:8px;flex:none}
.b-cols{grid-template-columns:34px minmax(0,1fr) 56px}
.u-cols{grid-template-columns:minmax(0,1fr) 72px}
.i-cols{grid-template-columns:minmax(0,1fr) 40px}
.trow:not(.sel){border-top:1px solid var(--line);border-radius:0}
.trow.sel.b{background:var(--teal);color:var(--teal-ink)}
.trow.sel.u{background:var(--amber);color:var(--amber-ink)}
.trow.sel + .trow{border-top-color:transparent}
.c-n{text-align:center;font-variant-numeric:tabular-nums}
.rmain .main{font-weight:650;overflow-wrap:anywhere}
.rmain .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;color:var(--muted)}
.empty{color:var(--muted);padding:10px 4px 14px;font-size:15px}

/* incident form */
.ctx{margin-bottom:18px;display:grid;gap:4px}
.ctx b{font-weight:700}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.photo{position:relative}
.photo>button.open{padding:0;border:0;background:none;display:block;border-radius:8px}
.photo img{width:88px;height:88px;object-fit:cover;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:block}
.photo .rm{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.bottombar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.circ{width:56px;height:56px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:none}
.circ.gal{background:var(--red);color:var(--red-ink)}
.circ.cam{background:var(--cam);color:#fff}
.bottombar .btn{margin-left:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.55);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheetactions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sheetactions .btn{flex:1 1 140px}
.menulist{display:grid;gap:8px}
.menulist .btn{justify-content:flex-start}
.bigphoto{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:var(--bg);display:block;margin-bottom:12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));max-width:min(92vw,520px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
.small{min-height:40px;padding:0 14px;font-size:15px;margin-left:auto}
a.btn{text-decoration:none}
.check{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 16px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.card.p .tile{background:var(--ok-bg);color:var(--ok)}
.card.p .addbtn{background:var(--ok);color:var(--ok-ink)}
.search{position:relative;margin:4px 0 12px}
.search input{padding-right:46px}
.search svg{position:absolute;right:13px;top:13px;color:var(--muted);pointer-events:none}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:999px;padding:4px;margin-bottom:6px}
.pseg button{min-height:40px;border:0;background:none;border-radius:999px;font-weight:700;color:var(--muted);font-size:14px}
.pseg button.on{background:var(--ok);color:var(--ok-ink)}
.phead{display:flex;justify-content:space-between;padding:10px 6px 6px;color:var(--ok);font-weight:700;font-size:14px}
.prow{display:flex;align-items:center;border-top:1px solid var(--line)}
.pmain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 6px;min-height:64px;color:inherit}
.pt{display:block;font-weight:650;overflow-wrap:anywhere}
.ps{display:block;font-size:14px;color:var(--muted)}
.switch{position:relative;flex:none;width:76px;height:44px;border-radius:22px;border:0;background:var(--off);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:flex-end;padding:0 11px;margin-right:2px}
.switch .knob{position:absolute;left:4px;top:4px;width:36px;height:36px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok);color:var(--ok-ink);justify-content:flex-start}
.switch.on .knob{left:36px}
.projhead{margin:0 0 16px}
.dots.sync.ok{color:var(--ok)}
.dots.sync.bad{color:var(--red)}
.thead.i-cols{padding-right:88px}
.aipreview{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--raised);white-space:pre-wrap;font-size:15px;max-height:200px;overflow:auto}
.aichecks{margin:0 0 14px;padding-left:20px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:650;padding:10px 4px;min-height:44px;text-decoration:underline}
.sheet h3{font-size:16px;margin:20px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="jszip.min.js"></script>
<script>
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dots:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  building:'<path d="M5 21V9l7-5 7 5v12M9 21v-5h6v5M9 11h.01M15 11h.01"/>',
  units:'<path d="M4 21V5h10v16M14 10h6v11M8 9h2M8 13h2M8 17h2M17 14h.01M17 18h.01"/>',
  incident:'<path d="M9 4h6v3H9zM7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1M9 12h6M9 16h4"/>',
  gallery:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l4-4 4 4 3-3 5 5M9 9h.01"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
  backup:'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>'
};
const icon = (n,size=22) => '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';
let toastT = null;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'),2800); }

/* ---------- storage (IndexedDB on this device) ---------- */
const mem = new Map();
let db = null, hasStore = false;
function openDb(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open('defect-app',1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
function tx(mode,fn){
  return new Promise((res,rej)=>{
    const t = db.transaction('kv',mode), req = fn(t.objectStore('kv'));
    t.oncomplete = ()=>res(req ? req.result : undefined);
    t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
  });
}
async function sget(k){
  if(db){ try{ const v = await tx('readonly',s=>s.get(k)); return v==null ? null : v; }catch(e){ return null; } }
  return mem.has(k) ? mem.get(k) : null;
}
async function sset(k,v){
  if(db){ try{ await tx('readwrite',s=>s.put(v,k)); }catch(e){ console.error(e); toast("Couldn't save. Your latest change may be lost."); } }
  else mem.set(k,v);
}
async function sdel(k){
  if(db){ try{ await tx('readwrite',s=>s.delete(k)); }catch(e){} } else mem.delete(k);
}

/* ---------- state ---------- */
let jobs = {projects:[]};
let localVersion = 0;
let proj = {buildings:[]};
let prefs = {prepared:''};
const state = {view:'projects', sel:{p:null,b:null,u:null}, edit:null, sheet:null, ui:{q:'',pf:'all'}};
const photoCache = {}, photoLoading = {};
const curB = () => proj.buildings.find(b=>b.id===state.sel.b) || null;
const curU = () => { const b = curB(); return b ? (b.units.find(u=>u.id===state.sel.u)||null) : null; };
let saveT = null;
function persist(){ localVersion++; clearTimeout(saveT); saveT = setTimeout(saveNow,300); if(typeof scheduleSync==='function') scheduleSync(); }
async function saveNow(){ clearTimeout(saveT); await sset('proj:main', JSON.stringify(jobs)); }
function fixSel(){
  if(!curB()) state.sel.b = proj.buildings.length ? proj.buildings[0].id : null;
  const b = curB();
  if(!b) state.sel.u = null; else if(!curU()) state.sel.u = b.units.length ? b.units[0].id : null;
}

/* ---------- photos ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const max = 1000; let w = img.width, h = img.height; const sc = Math.min(1,max/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.62));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function hydratePhotos(){
  document.querySelectorAll('img[data-photo]').forEach(img=>{
    const id = img.dataset.photo;
    if(photoCache[id]){ if(img.getAttribute('src')!==photoCache[id]) img.src = photoCache[id]; }
    else if(!photoLoading[id]){
      photoLoading[id] = true;
      sget('photo:'+id).then(v=>{ photoLoading[id] = false; if(v){ photoCache[id] = v; document.querySelectorAll('img[data-photo="'+id+'"]').forEach(im=>{ im.src = v; }); } });
    }
  });
}
function deletePhoto(pid){ delete photoCache[pid]; sdel('photo:'+pid); }

/* ---------- rendering ---------- */
const root = document.getElementById('app');
function render(reset){
  const y = window.scrollY;
  root.innerHTML = state.view==='incident' ? renderIncident() : (state.view==='projects' ? renderProjects() : renderMain());
  window.scrollTo(0, reset ? 0 : y);
  renderSheet(); hydratePhotos();
}
function fmtD(d){
  if(!d) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return '';
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function isSynced(i){ return (i.synced||0) > 0 && i.synced >= (i.modified||0); }
function markSynced(at){
  jobs.projects.forEach(pj=>pj.buildings.forEach(b=>b.units.forEach(u=>u.incidents.forEach(i=>{ if((i.modified||0) <= at) i.synced = at; }))));
  persist(); state.needsRender = true; toast('Synced: backed up');
}
function projCounts(p){ let i = 0; p.buildings.forEach(b=>b.units.forEach(u=>{ i += u.incidents.length; })); return {b:p.buildings.length,i:i}; }
function backupNudge(){
  if(!jobs.projects.length) return '';
  const lb = prefs.lastBackup;
  if(lb && Date.now()-lb <= 7*864e5) return '';
  return '<p class="sub">'+(lb?'Last backup: '+esc(new Date(lb).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}))+'.':'No backup yet.')+' <button class="linkbtn" data-action="backup-open">Back up now</button></p>';
}
function renderProjects(){
  const q = (state.ui.q||'').trim().toLowerCase(), f = state.ui.pf;
  let list = jobs.projects.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  if(f==='wip') list = list.filter(p=>!p.done); else if(f==='done') list = list.filter(p=>p.done);
  if(q) list = list.filter(p=>(p.address+' '+(p.initials||'')).toLowerCase().indexOf(q)>=0);
  let h = '<header class="topbar"><div class="brand">Defect inspection</div><button class="iconbtn" style="margin-left:auto" data-action="settings-open" aria-label="Settings">'+icon('settings')+'</button><button class="iconbtn" data-action="backup-open" aria-label="Backup and restore">'+icon('backup')+'</button></header><main class="pad">';
  h += '<section class="card p"><div class="chead"><span class="tile">'+icon('folder')+'</span><h2>Projects</h2><button class="addbtn" data-action="new-project">'+icon('plus',16)+'<span>Project</span></button></div>'
    +'<p class="sub" style="margin:-2px 2px 12px">All your jobs are listed here.</p>'
    +'<div class="search"><input type="search" data-search value="'+esc(state.ui.q)+'" placeholder="Search by address" aria-label="Search projects" autocomplete="off">'+icon('search',20)+'</div>'
    +'<div class="pseg" role="group" aria-label="Filter projects">'
    +[['all','All'],['wip','WIP'],['done','Done']].map(x=>'<button class="'+(f===x[0]?'on':'')+'" data-action="pfilter" data-val="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
  if(!jobs.projects.length){
    h += '<p class="empty">No projects yet. Tap + Project and enter the job address to start.</p>';
  } else if(!list.length){
    h += '<p class="empty">No projects match.</p>';
  } else {
    h += '<div class="phead"><span>Projects</span><span style="margin-right:56px">Done</span></div>'
      + list.map(p=>{
        const c = projCounts(p);
        const sub = [fmtD(p.date),p.initials].filter(Boolean).join(', ');
        return '<div class="prow"><button class="pmain" data-action="open-project" data-id="'+p.id+'"><span class="pt">'+esc(p.address)+'</span>'
          +'<span class="ps">'+(sub?esc(sub)+'. ':'')+c.b+' building'+(c.b===1?'':'s')+', '+c.i+' incident'+(c.i===1?'':'s')+'</span></button>'

function openProject(id){
  const p = jobs.projects.find(x=>x.id===id); if(!p) return;
  proj = p; state.sel = {p:id,b:null,u:null}; fixSel(); state.view = 'main'; render(true);
}
async function closeProject(){
  await saveNow();
  proj = {buildings:[]}; state.sel = {p:null,b:null,u:null}; state.view = 'projects'; render(true);
}
function saveProject(){
  const s = state.sheet, address = (s.address||'').trim();
  if(!address){ toast('Enter the job address.'); return; }
  const initials = (s.initials||'').trim().toUpperCase().slice(0,10);
  prefs.initials = initials; sset('prefs:main', JSON.stringify(prefs));
  if(s.id){
    const p = jobs.projects.find(x=>x.id===s.id); p.address = address; p.date = s.date||''; p.initials = initials; p.cls = s.cls||''; p.ncc = s.ncc||'';
    state.sheet = null; persist(); render(); toast('Project updated');
  } else {
    const np = {id:uid(),address:address,date:s.date||'',initials:initials,cls:s.cls||'',ncc:s.ncc||'',done:false,created:Date.now(),buildings:[]};
    jobs.projects.push(np); state.sheet = null; persist(); openProject(np.id);
  }
}

  if(!d.area.trim() && !d.description.trim()){ toast('Add an area or a description.'); return; }
  const rec = {id:e.id||uid(),area:d.area.trim(),description:d.description.trim(),causes:d.causes.trim(),breach:d.breach.trim(),scope:d.scope.trim(),photos:d.photos.slice(),created:d.created||Date.now()};

  rec.modified = Date.now(); rec.synced = prev ? (prev.synced||0) : 0;
  const idx = u.incidents.findIndex(i=>i.id===rec.id);
  if(idx>=0) u.incidents[idx] = rec; else u.incidents.push(rec);

      photoCache[pid] = data; await sset('photo:'+pid, data);

function imgSize(src){
  return new Promise(function(res){ var im = new Image(); im.onload = function(){ res({w:im.naturalWidth||4,h:im.naturalHeight||3}); }; im.onerror = function(){ res({w:4,h:3}); }; im.src = src; });

const isoToday = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
async function prepareReport(id,prepared,withPhotos){
  const b = proj.buildings.find(x=>x.id===id), units = [];
  for(const u of b.units){
    const incs = [];
    for(const inc of u.incidents){
      const images = [];
      if(withPhotos){
        for(const pid of inc.photos){
          const data = photoCache[pid] || await sget('photo:'+pid);
          if(!data) continue;
          const dim = await imgSize(data);
          images.push({data:data,w:dim.w,h:dim.h});
        }
      }
      incs.push({area:inc.area,description:inc.description,causes:inc.causes,breach:inc.breach,scope:inc.scope,images:images});
    }
    units.push({name:u.name,incidents:incs});
  }
  return {building:{ref:b.ref,name:b.name},project:{address:proj.address||'',dateText:fmtD(proj.date),clsText:({'1':'Class 1','2':'Class 2','other':'Other'})[proj.cls]||'',nccText:({'2022':'NCC 2022','2019':'NCC 2019','2016':'NCC 2016','older':'BCA 2015 or earlier'})[proj.ncc]||''},prepared:prepared,date:new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}),units:units};
}

async function runReport(){
  const s = state.sheet; if(generating || !s) return;
  if(typeof JSZip==='undefined'){ toast("Word export couldn't load. Check your connection and reopen the app."); return; }
  generating = true;
  const id = s.id, prepared = (s.prepared||'').trim(), withPhotos = !!s.photos;
  prefs.prepared = prepared; sset('prefs:main', JSON.stringify(prefs));
  state.sheet = {type:'working'}; renderSheet();
  try{
    const data = await prepareReport(id,prepared,withPhotos);
    const zip = makeDocx(JSZip,data);
    const blob = await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
    const url = URL.createObjectURL(blob);
    const safe = data.building.name.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'building';
    state.sheet = {type:'ready',url:url,blob:blob,name:'Defect-report-'+safe+'-'+isoToday()+'.docx'}; renderSheet();
  }catch(err){ console.error(err); state.sheet = null; renderSheet(); toast("Couldn't create the report. Try again."); }

}

function suggestFor(e, pj){
  const edKey = pj.ncc || '';
  const volKey = pj.cls==='2' ? 'v1' : pj.cls==='1' ? 'v2' : '';
  const edLabel = pj.ncc==='older' ? 'BCA [CONFIRM EDITION]' : pj.ncc ? 'NCC '+pj.ncc : 'NCC [CONFIRM EDITION]';
  const volLabel = e.vol || (pj.cls==='1' ? 'Volume Two' : pj.cls==='2' ? 'Volume One' : '[CONFIRM VOLUME]');
  const lines = [];
  const hit = e.ncc && e.ncc[edKey] && volKey ? e.ncc[edKey][volKey] : null;
  if(hit){
    const t = typeof hit==='string' ? hit : hit.t;
    lines.push('Non-compliance with '+edLabel+' '+volLabel+': '+t+'.'+(hit.c ? ' Clause: [CONFIRM CLAUSE].' : ''));
    if(hit.r) lines.push('Summary of the requirement: '+hit.r);
  } else if(e.fb){
    lines.push('Non-compliance with '+edLabel+' '+volLabel+': '+e.fb+'. Clause: [CONFIRM CLAUSE].');
  }
  e.std.forEach(a=>{
    const yr = a.ed && a.ed[edKey] ? ':'+a.ed[edKey] : '';
    const cl = a.cl && a.cl[edKey] ? ', '+a.cl[edKey] : '';
    lines.push('Non-compliance with '+a.n+yr+' '+a.t+cl+'.');
  });
  if(e.std.length>1) lines.push('[Delete any standard above that does not apply.]');
  return {breach:lines.join('\n'), scope:e.scope.map((l,i)=>(i+1)+'. '+l).join('\n')};
}

function allPhotoIds(){
  const ids = [];
  jobs.projects.forEach(pj=>pj.buildings.forEach(b=>b.units.forEach(u=>u.incidents.forEach(i=>i.photos.forEach(p=>ids.push(p))))));

async function makeBackup(){
  if(generating) return; generating = true;
  const startedAt = Date.now();
  state.sheet = {type:'working',title:'Creating backup',body:'Gathering your records and photos. This can take a few seconds.'}; renderSheet();
  try{
    const photos = {};
    for(const id of allPhotoIds()){
      const d = photoCache[id] || await sget('photo:'+id);
      if(d) photos[id] = d;
    }
    const data = {app:'defect-app',version:2,exported:new Date().toISOString(),root:jobs,photos:photos};
    const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    prefs.lastBackup = Date.now(); sset('prefs:main', JSON.stringify(prefs));
    state.sheet = {type:'ready',url:url,blob:blob,name:'defect-backup-'+isoToday()+'.json',title:'Backup ready',btnLabel:'Download backup file',syncAt:startedAt,note:'Download or share this file and keep it somewhere safe, like Google Drive. Your incidents turn green once you do.'};
    render();
  }catch(err){ console.error(err); state.sheet = null; renderSheet(); toast("Couldn't create the backup. Try again."); }
  generating = false;
}
function parseBackup(o){
  const idOk = v => typeof v==='string' && /^[A-Za-z0-9]{1,40}$/.test(v);
  const str = v => typeof v==='string' ? v : '';
  if(!o || o.app!=='defect-app') throw new Error('not a backup');
  let projects;
  if(o.root && Array.isArray(o.root.projects)) projects = o.root.projects;
  else if(o.proj && Array.isArray(o.proj.buildings)) projects = [{id:'imported'+Date.now().toString(36),address:'Imported records',date:'',initials:'',done:false,created:Date.now(),buildings:o.proj.buildings}];
  else throw new Error('not a backup');
  const photos = {}; let nPh = 0, nInc = 0, nB = 0;
  const outProjects = projects.map(pj=>{
    if(!pj || !idOk(pj.id) || !Array.isArray(pj.buildings)) throw new Error('bad project');
    const buildings = pj.buildings.map(b=>{
      if(!b || !idOk(b.id) || !Array.isArray(b.units)) throw new Error('bad building');
      return {id:b.id,ref:Number(b.ref)||1,name:str(b.name),units:b.units.map(u=>{
        if(!u || !idOk(u.id) || !Array.isArray(u.incidents)) throw new Error('bad unit');
        return {id:u.id,name:str(u.name),incidents:u.incidents.map(i=>{
          if(!i || !idOk(i.id)) throw new Error('bad incident');
          const ph = (Array.isArray(i.photos)?i.photos:[]).filter(p=>idOk(p) && o.photos && typeof o.photos[p]==='string' && o.photos[p].indexOf('data:image/')===0);
          ph.forEach(p=>{ photos[p] = o.photos[p]; nPh++; });
          nInc++;
          return {id:i.id,area:str(i.area),description:str(i.description),causes:str(i.causes),breach:str(i.breach),scope:str(i.scope),photos:ph,created:Number(i.created)||Date.now(),modified:Number(i.modified)||0,synced:Date.now()};
        })};
      })};
    });
    nB += buildings.length;
    return {id:pj.id,address:str(pj.address),date:/^\d{4}-\d{2}-\d{2}$/.test(pj.date||'')?pj.date:'',initials:str(pj.initials).slice(0,10),cls:/^(1|2|other)$/.test(pj.cls)?pj.cls:'',ncc:/^(2022|2019|2016|older)$/.test(pj.ncc)?pj.ncc:'',done:!!pj.done,created:Number(pj.created)||Date.now(),buildings:buildings};
  });
  return {root:{projects:outProjects},photos:photos,counts:{projects:outProjects.length,buildings:nB,incidents:nInc,photos:nPh},exported:o.exported};
}
async function readBackup(file){
  let parsed;
  try{ parsed = parseBackup(JSON.parse(await file.text())); }
  catch(err){ toast("That file isn't a backup from this app."); return; }
  const c = parsed.counts;
  const when = parsed.exported ? new Date(parsed.exported).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) : 'unknown date';
  ask('Replace everything with this backup?','Backup from '+when+': '+c.projects+' project'+(c.projects===1?'':'s')+', '+c.buildings+' building'+(c.buildings===1?'':'s')+', '+c.incidents+' incident'+(c.incidents===1?'':'s')+', '+c.photos+' photo'+(c.photos===1?'':'s')+'. Everything now in the app will be replaced.','Replace',()=>doRestore(parsed),'Cancel');
}
async function doRestore(parsed){
  state.sheet = {type:'working',title:'Restoring',body:'Putting your records and photos back. Please keep this open.'}; renderSheet();
  try{
    for(const id of allPhotoIds()){ delete photoCache[id]; await sdel('photo:'+id); }
    for(const id of Object.keys(parsed.photos)){ photoCache[id] = parsed.photos[id]; await sset('photo:'+id, parsed.photos[id]); }
    jobs = parsed.root; proj = {buildings:[]}; state.sel = {p:null,b:null,u:null}; state.view = 'projects';
    cloudState.base = {}; cloudState.meta = {}; await saveCloudState();
    await saveNow();
    state.sheet = null; render(true); toast('Backup restored');
  }catch(err){ console.error(err); state.sheet = null; render(true); toast("Couldn't restore the backup."); }
}

function sanitizeAi(r){
  const str = (v,n) => (typeof v==='string' ? v.trim().slice(0,n) : '');
  const ids = (Array.isArray(r.breachIds)?r.breachIds:[]).filter(x=>typeof x==='string' && LIB.some(l=>l.id===x)).slice(0,3);
  const checks = (Array.isArray(r.checks)?r.checks:[]).filter(x=>typeof x==='string').map(x=>x.trim().slice(0,300)).filter(Boolean).slice(0,8);
  const out = {description:str(r.description,3000),causes:str(r.causes,2000),breachIds:ids,scopeNote:str(r.scopeNote,1500),checks:checks};
  const parts = ids.map(id=>suggestFor(LIB.find(x=>x.id===id), proj));
  out.breachText = parts.map(p=>p.breach).join('\n\n');
  out.scopeText = (parts[0] ? parts[0].scope : '') + (out.scopeNote ? (parts[0]?'\n\n':'')+'Site-specific notes: '+out.scopeNote : '');
  return out;
}

async function callAi(imgs, signal){
  const ctx = aiContext(), library = LIB.map(x=>({id:x.id,name:x.name}));
  if(prefs.aiUrl){
    const res = await fetch(prefs.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:prefs.aiCode||'',context:ctx,images:imgs,library:library}),signal:signal});
    if(res.status===401) throw new Error('code');
    if(!res.ok) throw new Error('http');
    const data = await res.json();
    if(!data || !data.ok || !data.result) throw new Error('bad');
    return data.result;
  }
  const content = [];
  imgs.forEach(d=>{ const m = /^data:(image\/(?:jpeg|png|webp|gif));base64,(.+)$/.exec(d); if(m) content.push({type:'image',source:{type:'base64',media_type:m[1],data:m[2]}}); });
  content.push({type:'text',text:'Defect details (JSON):\n'+JSON.stringify(ctx,null,2)+'\n\nLibrary of defect types you may choose from (use the id values):\n'+library.map(x=>x.id+': '+x.name).join('\n')+'\n\nReturn only the JSON object.'});
  const res = await fetch(prefs.aiApiBase||AI_API,{method:'POST',signal:signal,
    headers:{'content-type':'application/json','x-api-key':prefs.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:AI_MODEL,max_tokens:3000,thinking:{type:'between_tools'},output_config:{effort:'medium'},system:AI_SYSTEM,messages:[{role:'user',content:content}]})});
  if(res.status===401) throw new Error('key');
  if(!res.ok){ const err = new Error('api'); err.status = res.status; throw err; }
  const data = await res.json();
  const text = (data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
  const i = text.indexOf('{'), j = text.lastIndexOf('}');
  if(i<0 || j<=i) throw new Error('bad');
  try{ return JSON.parse(text.slice(i,j+1)); }catch(e){ throw new Error('bad'); }
}

  if(err.message==='api') return 'The AI service returned an error ('+err.status+'). Check your Anthropic account has credit.';
  if(err.message==='bad') return 'The AI reply could not be read. Please try again.';
  return "Couldn't reach the AI service. Check your signal"+(prefs.aiUrl?' and the server address':'')+'.';
}

/*MERGE_START*/
const PF = ['address','date','initials','cls','ncc','done'];
const canon = x => JSON.stringify(x,(k,v)=>{ if(k==='synced') return undefined; if(v && typeof v==='object' && !Array.isArray(v)){ const o = {}; Object.keys(v).sort().forEach(kk=>{ o[kk] = v[kk]; }); return o; } return v; });
const same = (a,b) => canon(a)===canon(b);
function pick3(bv,lv,rv){
  if(lv===rv) return lv;
  if(bv===undefined) return lv;
  if(lv===bv) return rv;
  return lv;
}
function mergeList(base,loc,rem,mergeItem){
  const bm = new Map(base.map(x=>[x.id,x])), lm = new Map(loc.map(x=>[x.id,x])), rm = new Map(rem.map(x=>[x.id,x]));
  const order = []; loc.forEach(x=>order.push(x.id)); rem.forEach(x=>{ if(!lm.has(x.id)) order.push(x.id); });
  const out = [];
  order.forEach(id=>{
    const b = bm.get(id), l = lm.get(id), r = rm.get(id);
    if(l && r) out.push(mergeItem(b,l,r));
    else if(l){ if(b && same(l,b)) return; out.push(l); }
    else if(r){ if(b && same(r,b)) return; out.push(r); }
  });
  return out;
}
function mergeIncident(b,l,r){
  if(same(l,r)) return l;
  if(b && same(l,b)) return r;
  if(b && same(r,b)) return l;
  return (l.modified||0) >= (r.modified||0) ? l : r;
}
function mergeUnit(b,l,r){
  const bb = b || {name:undefined,incidents:[]};
  return {id:l.id,name:pick3(bb.name,l.name,r.name),incidents:mergeList(bb.incidents,l.incidents||[],r.incidents||[],mergeIncident)};
}
function mergeBuilding(b,l,r){
  const bb = b || {ref:undefined,name:undefined,units:[]};
  return {id:l.id,ref:pick3(bb.ref,l.ref,r.ref),name:pick3(bb.name,l.name,r.name),units:mergeList(bb.units,l.units||[],r.units||[],mergeUnit)};
}
function mergeProject(b,l,r){
  const bb = b || {buildings:[]};
  const out = {id:l.id,created:l.created||r.created,buildings:mergeList(bb.buildings,l.buildings||[],r.buildings||[],mergeBuilding)};
  PF.forEach(k=>{ out[k] = pick3(bb[k],l[k],r[k]); });
  return out;
}
/*MERGE_END*/
let cloudState = {base:{},meta:{},photosUp:{}};
let cloudMsg = '', syncing = false, syncTimer = null, resyncTimer = null;
const cloudOn = () => !!(prefs.cloud && prefs.cloud.url && prefs.cloud.key && prefs.cloud.session);
function fmtClock(t){ return new Date(t).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); }
function cloudStatusText(){
  if(cloudMsg) return cloudMsg;
  return prefs.cloud && prefs.cloud.lastSync ? 'Last synced '+fmtClock(prefs.cloud.lastSync)+'.' : 'Not synced yet.';
}
function setCloudMsg(m){
  cloudMsg = m;
  const el = document.getElementById('cloudline'); if(el) el.innerHTML = cloudLineInner();
}
function cloudLineInner(){ return 'Cloud: '+esc(cloudStatusText())+' <button class="linkbtn" data-action="cloud-sync">Sync now</button>'; }
function cloudLine(){ return cloudOn() ? '<p class="sub" id="cloudline">'+cloudLineInner()+'</p>' : ''; }
async function saveCloudState(){ await sset('cloud:state', JSON.stringify(cloudState)); }
function scheduleSync(){
  if(!cloudOn()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(false), 4000);
}
async function refreshSession(){
  const c = prefs.cloud;
  const res = await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.session.refresh})});
  if(!res.ok){ const e = new Error('auth'); e.status = res.status; throw e; }
  const j = await res.json();
  c.session = {access:j.access_token,refresh:j.refresh_token||c.session.refresh,expires:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||c.session.uid};
  await sset('prefs:main', JSON.stringify(prefs));
}
async function ensureSession(){ if(Date.now() > prefs.cloud.session.expires-60000) await refreshSession(); }
async function sbReq(method,path,body,headers,raw){
  await ensureSession();
  const c = prefs.cloud;
  const h = Object.assign({apikey:c.key,Authorization:'Bearer '+c.session.access},headers||{});
  const init = {method:method,headers:h,cache:'no-store'};
  if(body!==undefined){ if(typeof Blob!=='undefined' && body instanceof Blob) init.body = body; else { h['Content-Type']='application/json'; init.body = JSON.stringify(body); } }
  let res = await fetch(c.url+path, init);
  if(res.status===401){ await refreshSession(); h.Authorization = 'Bearer '+prefs.cloud.session.access; res = await fetch(c.url+path, init); }
  if(!res.ok){ const e = new Error('http'); e.status = res.status; try{ e.body = await res.text(); }catch(_){} throw e; }
  if(raw) return res;
  return res.status===204 ? null : res.json();
}
function dataUrlToBlob(d){
  const m = /^data:(.*?);base64,(.*)$/.exec(d); const bin = atob(m[2]); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr],{type:m[1]||'image/jpeg'});
}
function blobToDataUrl(b){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function photoIdsOf(p){ const ids = []; p.buildings.forEach(b=>b.units.forEach(u=>u.incidents.forEach(i=>(i.photos||[]).forEach(x=>ids.push(x))))); return ids; }
function cloudDoc(p){ return JSON.parse(canon(p)); }
const deep = x => JSON.parse(JSON.stringify(x));
async function uploadPhoto(pid){
  const d = photoCache[pid] || await sget('photo:'+pid); if(!d) return false;
  await sbReq('POST','/storage/v1/object/photos/'+prefs.cloud.session.uid+'/'+pid+'.jpg',dataUrlToBlob(d),{'x-upsert':'true'},true);
  cloudState.photosUp[pid] = true; return true;
}
async function downloadPhoto(pid){
  const res = await sbReq('GET','/storage/v1/object/authenticated/photos/'+prefs.cloud.session.uid+'/'+pid+'.jpg',undefined,undefined,true);
  const d = await blobToDataUrl(await res.blob());
  photoCache[pid] = d; await sset('photo:'+pid, d); cloudState.photosUp[pid] = true;
}
async function inChunks(items,n,fn){
  let failed = 0;
  for(let i=0;i<items.length;i+=n){
    const rs = await Promise.all(items.slice(i,i+n).map(x=>fn(x).then(()=>0,()=>1)));
    failed += rs.reduce((a,b)=>a+b,0);
  }
  return failed;
}
async function syncNow(manual){
  if(!cloudOn()){ if(manual) toast('Sign in to cloud sync in Settings first.'); return; }
  if(syncing) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false){ setCloudMsg('Offline. Changes will sync when you reconnect.'); return; }
  syncing = true; setCloudMsg('Syncing...');
  const startVer = localVersion, startAt = Date.now();
  try{
    const remoteList = await sbReq('GET','/rest/v1/projects?select=id,updated_at,deleted');
    const rmeta = new Map(remoteList.map(r=>[r.id,r]));
    const localSnap = JSON.parse(JSON.stringify(jobs.projects));
    const ids = []; const seen = new Set();
    [localSnap.map(p=>p.id),Object.keys(cloudState.base),remoteList.map(r=>r.id)].forEach(a=>a.forEach(id=>{ if(!seen.has(id)){ seen.add(id); ids.push(id); } }));
    const merged = new Map(), newBase = {}, newMeta = {}, pushes = [];
    for(const id of ids){
      const l = localSnap.find(p=>p.id===id) || null;
      const b = cloudState.base[id] || null;
      const rm = rmeta.get(id) || null;
      if(rm && rm.deleted){
        if(l){
          if(b && same(l,b)){ /* remote deleted, local unchanged: drop it */ }
          else { merged.set(id,l); pushes.push({id:id,doc:cloudDoc(l),deleted:false,expect:rm.updated_at,local:l}); }
        }
        continue;
      }
      if(rm){
        let r;
        if(b && cloudState.meta[id]===rm.updated_at) r = deep(b);
        else { const rows = await sbReq('GET','/rest/v1/projects?select=data&id=eq.'+encodeURIComponent(id)); r = rows[0] && rows[0].data; }
        if(!r) continue;
        if(l){
          const m = mergeProject(b,l,r);
          merged.set(id,m); newBase[id] = deep(m); newMeta[id] = rm.updated_at;
          if(!same(m,r)) pushes.push({id:id,doc:cloudDoc(m),deleted:false,expect:rm.updated_at,local:m});
        } else if(b){
          if(same(r,b)) pushes.push({id:id,doc:cloudDoc(r),deleted:true,expect:rm.updated_at,local:null});
          else { merged.set(id,r); newBase[id] = deep(r); newMeta[id] = rm.updated_at; }
        } else { merged.set(id,r); newBase[id] = deep(r); newMeta[id] = rm.updated_at; }
      } else if(l){
        merged.set(id,l); pushes.push({id:id,doc:cloudDoc(l),deleted:false,expect:null,local:l});
      }
    }
    // photos first, so the cloud has them before any record points at them
    const wantUp = [];
    pushes.forEach(p=>{ if(!p.deleted) photoIdsOf(p.doc).forEach(x=>{ if(!cloudState.photosUp[x] && wantUp.indexOf(x)<0) wantUp.push(x); }); });
    let photoFails = await inChunks(wantUp,3,uploadPhoto);
    const okIds = new Set(merged.keys());
    let conflicts = 0;
    for(const p of pushes){
      const ts = Math.max(Date.now(), (p.expect||0)+1);
      let rows;
      if(p.expect===null){
        rows = await sbReq('POST','/rest/v1/projects?on_conflict=id',{id:p.id,data:p.doc,updated_at:ts,deleted:false},{Prefer:'resolution=merge-duplicates,return=representation'});
      } else {
        rows = await sbReq('PATCH','/rest/v1/projects?id=eq.'+encodeURIComponent(p.id)+'&updated_at=eq.'+p.expect,{data:p.doc,updated_at:ts,deleted:p.deleted},{Prefer:'return=representation'});
      }
      if(!rows || !rows.length){ conflicts++; okIds.delete(p.id); continue; }
      if(!p.deleted && p.local){ newBase[p.id] = deep(p.local); newMeta[p.id] = ts; }
    }
    // photos that other devices uploaded
    const have = new Set(); const need = [];
    merged.forEach(p=>photoIdsOf(p).forEach(x=>{ if(!have.has(x)){ have.add(x); need.push(x); } }));
    const missing = [];
    for(const x of need){ if(!(photoCache[x] || await sget('photo:'+x))) missing.push(x); else if(!cloudState.photosUp[x] && !wantUp.includes(x)){ /* local-only photo of an unchanged project */ } }
    photoFails += await inChunks(missing,3,downloadPhoto);
    // apply, unless the user changed something while we were syncing
    if(localVersion!==startVer){
      await saveCloudState(); syncing = false; setCloudMsg('Syncing...'); clearTimeout(resyncTimer); resyncTimer = setTimeout(()=>syncNow(false),800); return;
    }
    const order = []; localSnap.forEach(p=>{ if(merged.has(p.id)) order.push(p.id); }); merged.forEach((v,k)=>{ if(order.indexOf(k)<0) order.push(k); });
    jobs.projects = order.map(id=>merged.get(id));
    jobs.projects.forEach(p=>{ if(okIds.has(p.id)) p.buildings.forEach(b=>b.units.forEach(u=>u.incidents.forEach(i=>{ if((i.modified||0)<=startAt) i.synced = startAt; }))); });
    cloudState.base = newBase; cloudState.meta = newMeta;
    prefs.cloud.lastSync = Date.now(); await sset('prefs:main', JSON.stringify(prefs));
    await saveCloudState(); await saveNow();
    if(state.sel.p){ const cur = jobs.projects.find(p=>p.id===state.sel.p); if(cur){ proj = cur; fixSel(); } else if(state.view!=='projects'){ proj = {buildings:[]}; state.sel = {p:null,b:null,u:null}; state.edit = null; state.view = 'projects'; } }
    cloudMsg = conflicts ? 'Synced, but '+conflicts+' project'+(conflicts===1?'':'s')+' changed elsewhere. Syncing again shortly.' : (photoFails ? 'Synced. '+photoFails+' photo'+(photoFails===1?'':'s')+' still to transfer.' : '');
    if(state.view!=='incident' && !state.sheet) render();
    else setCloudMsg(cloudMsg);
    if(conflicts || photoFails){ clearTimeout(resyncTimer); resyncTimer = setTimeout(()=>syncNow(false), 15000); }
    if(manual && !conflicts && !photoFails) toast('Synced.');
  }catch(err){
    console.error(err);
    if(err.message==='auth' || err.status===401){ prefs.cloud.session = null; await sset('prefs:main', JSON.stringify(prefs)); setCloudMsg('Signed out. Sign in again in Settings.'); if(manual) toast('Signed out. Sign in again in Settings.'); }
    else if(err.status===404 || (err.body||'').indexOf('projects')>=0 && err.status>=400 && err.status<500){ setCloudMsg('Sync failed: the cloud tables are missing. Run the setup script in Supabase.'); if(manual) toast('The cloud tables are missing. Run the setup script in Supabase.'); }
    else { setCloudMsg('Sync failed. Will retry.'); if(manual) toast("Couldn't sync. Check your signal and try again."); clearTimeout(resyncTimer); resyncTimer = setTimeout(()=>syncNow(false), 30000); }
  }finally{ syncing = false; }
}
async function cloudSignIn(){

    case 'backup-open': state.sheet = {type:'backup'}; renderSheet(); break;
    case 'backup-make': makeBackup(); break;
    case 'restore-pick': { const i = document.getElementById('restoreInput'); if(i) i.click(); break; }
    case 'mark-synced': if(state.sheet && state.sheet.syncAt) markSynced(state.sheet.syncAt); break;
    case 'sync-icon': {
      const inc = curU().incidents.find(x=>x.id===t.dataset.id);
      if(inc && isSynced(inc)) toast(cloudOn()?'Already in the cloud':'Already backed up'); else if(cloudOn()) syncNow(true); else makeBackup(); break; }
    case 'sync-now': state.sheet = null; renderSheet(); makeBackup(); break;
    case 'edit-incident': { const id = state.sheet.id; state.sheet = null; renderSheet(); openIncident(id); break; }
    case 'share-report': {
      const s = state.sheet, file = new File([s.blob], s.name, {type:s.blob.type});
      if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:s.name}).then(()=>{ if(s.syncAt) markSynced(s.syncAt); }).catch(()=>{}); }
      else toast("Sharing isn't available here. Try the download button.");
      break; }
    case 'delete-item': {
      const s = state.sheet;
      ask('Delete '+s.kind+'?', s.kind==='incident' ? 'Its details and photos will be removed. This cannot be undone.' : s.kind==='project' ? 'All buildings, units, incidents and photos in "'+s.name+'" will be removed. This cannot be undone.' : s.kind==='building' ? 'All units, incidents and photos in "'+s.name+'" will be removed. This cannot be undone.' : 'All incidents and photos in "'+s.name+'" will be removed. This cannot be undone.', 'Delete '+s.kind, ()=>{
        if(s.kind==='incident'){
          const un = curU(), inc = un.incidents.find(x=>x.id===s.id);
          if(inc) inc.photos.forEach(deletePhoto);
          un.incidents = un.incidents.filter(x=>x.id!==s.id);
          persist(); render(); toast('Deleted'); return;
        }
        if(s.kind==='project'){
          const pj = jobs.projects.find(x=>x.id===s.id);
          pj.buildings.forEach(b=>b.units.forEach(u=>photosOfUnit(u).forEach(deletePhoto)));
          jobs.projects = jobs.projects.filter(x=>x.id!==s.id);
          persist(); render(); toast('Deleted'); return;
        }
        if(s.kind==='building'){
          const b = proj.buildings.find(x=>x.id===s.id);
          b.units.forEach(u=>photosOfUnit(u).forEach(deletePhoto));
          proj.buildings = proj.buildings.filter(x=>x.id!==s.id);
          if(state.sel.b===s.id){ state.sel.b = null; state.sel.u = null; }
        } else {
          const b = curB(), u = b.units.find(x=>x.id===s.id);
          photosOfUnit(u).forEach(deletePhoto);
          b.units = b.units.filter(x=>x.id!==s.id);
          if(state.sel.u===s.id) state.sel.u = null;
        }
        fixSel(); persist(); render(); toast('Deleted');
      }); break; }
    case 'confirm-yes': { const fn = state.sheet.fn; state.sheet = null; renderSheet(); fn(); break; }
    case 'close-sheet': closeSheet(); break;
    case 'back-main': leaveEdit(); break;
    case 'save-incident': saveIncident(); break;
    case 'delete-incident': {
      const e = state.edit;
      ask('Delete this incident?','Its details and photos will be removed.','Delete incident',()=>{
        const u = curU(), rec = u.incidents.find(i=>i.id===e.id);
        if(rec) rec.photos.forEach(deletePhoto);
        e.added.forEach(deletePhoto);
        u.incidents = u.incidents.filter(i=>i.id!==e.id);
        state.edit = null; state.view = 'main'; persist(); render(true); toast('Incident deleted');
      }); break; }
    case 'pick-gallery': { const i = document.getElementById('galleryInput'); if(i) i.click(); break; }
    case 'pick-camera': { const i = document.getElementById('cameraInput'); if(i) i.click(); break; }
    case 'view-photo': state.sheet = {type:'photo',id:t.dataset.id}; renderSheet(); break;
    case 'rm-photo': {
      const e = state.edit, pid = t.dataset.id;
      e.draft.photos = e.draft.photos.filter(p=>p!==pid);
      if(e.added.includes(pid)){ e.added = e.added.filter(p=>p!==pid); deletePhoto(pid); } else e.removed.push(pid);
      render(); break; }
  }
});
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.dataset.f && state.edit) state.edit.draft[t.dataset.f] = t.value;
  else if(t.dataset.p && state.sheet && state.sheet.type==='project') state.sheet[t.dataset.p] = t.value;
  else if(t.dataset.s && state.sheet && state.sheet.type==='settings') state.sheet[t.dataset.s] = t.value;
  else if(t.dataset.lib !== undefined && state.sheet && state.sheet.type==='suggest'){
    state.sheet.q = t.value; renderSheet();
    const el = document.querySelector('[data-lib]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  else if(t.dataset.search !== undefined){
    state.ui.q = t.value; render();
    const el = document.querySelector('[data-search]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  else if(t.dataset.r==='prepared' && state.sheet) state.sheet.prepared = t.value;
});
document.addEventListener('change', ev=>{
  const t = ev.target;
  if(t.dataset.r==='photos' && state.sheet) state.sheet.photos = t.checked;
  if(t.dataset.ai && state.sheet && state.sheet.type==='ai-review') state.sheet.use[t.dataset.ai] = t.checked;
  if(t.id==='galleryInput' || t.id==='cameraInput'){ const files = Array.from(t.files); t.value = ''; addPhotos(files); }
  if(t.id==='restoreInput'){ const f = t.files && t.files[0]; t.value = ''; if(f) readBackup(f); }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && state.sheet) closeSheet();
  if(ev.key==='Enter' && state.sheet && state.sheet.type==='name' && ev.target.id==='nameInput'){ ev.preventDefault(); saveName(); }
  if(ev.key==='Enter' && state.sheet && state.sheet.type==='project' && ev.target.id==='projAddr'){ ev.preventDefault(); saveProject(); }
});

(async function init(){
  db = await openDb(); hasStore = !!db;
  if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    try{
      let hadCtl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(hadCtl && state.view==='projects' && !state.sheet) location.reload(); hadCtl = true; });
      navigator.serviceWorker.register('sw.js');
    }catch(e){}
  }
  const v = await sget('proj:main');
  if(v){
    try{
      const o = JSON.parse(v);
      if(o && Array.isArray(o.projects)) jobs = o;
      else if(o && Array.isArray(o.buildings)){
        jobs = {projects:[{id:uid(),address:'My first project',date:'',initials:'',done:false,created:Date.now(),buildings:o.buildings}]};
        persist();
      }
    }catch(e){}
  }
  const pv = await sget('prefs:main'); if(pv){ try{ prefs = Object.assign(prefs, JSON.parse(pv)); }catch(e){} }
  const cs = await sget('cloud:state'); if(cs){ try{ cloudState = Object.assign(cloudState, JSON.parse(cs)); }catch(e){} }
  render(true);
  if(cloudOn()) setTimeout(()=>syncNow(false), 600);
  window.addEventListener('online', ()=>{ if(cloudOn()) syncNow(false); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && cloudOn() && Date.now()-((prefs.cloud&&prefs.cloud.lastSync)||0) > 60000) syncNow(false); });
})();
</script>
</body>
